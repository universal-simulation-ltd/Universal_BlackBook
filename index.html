<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Universal BlackBook — a private address book that remembers who to keep up with</title>
    <meta
      name="description"
      content="A private address book. File people under your own categories, say how often you want to be in touch, and keep notes. No account needed — it runs in your browser, and the optional online copy is end-to-end encrypted."
    />

    <meta name="author" content="UNI·SIM" />
    <meta name="theme-color" content="#020617" />
    <link rel="canonical" href="https://opensource.unisim.co.uk/blackbook/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Universal BlackBook" />
    <meta property="og:title" content="Universal BlackBook — a private address book" />
    <meta property="og:description" content="File people under your own categories, say how often you want to be in touch, keep notes. No account needed; the optional online copy is end-to-end encrypted." />

    <!-- Structured data. The credit James asked for on 2026-09-05 lives in two
         places, and this is the one a search engine can read: the in-app line
         is in the SDK's <AboutAppDialog>, which is a React portal and only
         enters the DOM once somebody opens it, so a crawler never sees it.

         Every value below is taken from THIS FILE's own <title>, description
         and canonical rather than typed again, so the block cannot drift from
         what the page already says about itself. The author matches the app's
         marketing page on unisim.co.uk and points at the same /about-james,
         so both resolve to one person rather than two mentions of a name. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Universal BlackBook",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web browser",
      "url": "https://opensource.unisim.co.uk/blackbook/",
      "description": "File people under your own categories, say how often you want to be in touch, keep notes. No account needed; the optional online copy is end-to-end encrypted.",
      "isAccessibleForFree": true,
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "GBP"
      },
      "author": [
        {
          "@type": "Person",
          "name": "James Markey",
          "honorificSuffix": "MBE",
          "jobTitle": "Founder & Director",
          "url": "https://www.unisim.co.uk/about-james"
        },
        {
          "@type": "Organization",
          "name": "UNI·SIM",
          "url": "https://www.unisim.co.uk",
          "subjectOf": {
            "@type": "BlogPosting",
            "name": "Welcome to the UNI·SIM studio",
            "url": "https://www.unisim.co.uk/blog/welcome-to-uni-sim"
          }
        }
      ],
      "provider": {
        "@type": "Organization",
        "name": "UNI·SIM",
        "url": "https://www.unisim.co.uk"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
